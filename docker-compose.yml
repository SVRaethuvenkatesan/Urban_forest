services:
  db:
    image: postgis/postgis:16-3.4
    container_name: uf_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urbanforest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbanforest}
      POSTGRES_DB: ${POSTGRES_DB:-urbanforest}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: uf_app
    env_file:
      - .env
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  pgdata:
